<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHunting - Dang Nhap</title>
    <meta name="description" content="Dang nhap he thong san may Da Lat">
    <link rel="stylesheet" href="/app/css/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-logo">&#9729;</div>
        <h1 class="login-title">CloudHunting</h1>
        <p class="login-subtitle">He thong du bao san may Da Lat</p>

        <div class="login-card">
            <!-- Tab Bar -->
            <div class="tab-bar">
                <button class="tab-btn active" id="tab-login">Dang nhap</button>
                <button class="tab-btn" id="tab-register">Dang ky</button>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-username">Ten dang nhap</label>
                    <input class="form-input" type="text" id="login-username" 
                           placeholder="Nhap ten dang nhap" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-password">Mat khau</label>
                    <input class="form-input" type="password" id="login-password" 
                           placeholder="Nhap mat khau" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary">Dang nhap</button>
            </form>

            <!-- Register Form (hidden) -->
            <form id="register-form" style="display: none;">
                <div class="form-group">
                    <label class="form-label" for="reg-username">Ten dang nhap</label>
                    <input class="form-input" type="text" id="reg-username" 
                           placeholder="Chon ten dang nhap" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-email">Email</label>
                    <input class="form-input" type="email" id="reg-email" 
                           placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-password">Mat khau</label>
                    <input class="form-input" type="password" id="reg-password" 
                           placeholder="Toi thieu 6 ky tu" required>
                </div>
                <button type="submit" class="btn btn-primary">Tao tai khoan</button>
            </form>
        </div>
    </div>

    <script src="/app/js/api.js"></script>
    <script src="/app/js/app.js"></script>
    <script>
        // Neu da dang nhap roi thi chuyen thang vao trang chinh
        if (isLoggedIn()) {
            window.location.href = '/app/index.html';
        }
        initLoginPage();
    </script>
</body>
</html>
