<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHunting - San May Da Lat</title>
    <meta name="description" content="Tim dia diem san may tot nhat tai Da Lat voi AI">
    <link rel="stylesheet" href="/app/css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-brand">
            <span class="icon">&#9729;</span>
            <span>CloudHunting</span>
        </div>
        <div class="navbar-user">
            <span id="display-username"></span>
            <button class="btn-logout" id="btn-logout">Thoat</button>
        </div>
    </nav>

    <div class="container">
        <!-- Search Section -->
        <section class="search-section">
            <h2>&#127748; Tim diem san may</h2>
            <p>Nhap dia diem ban dang o va ban kinh muon kham pha</p>

            <form id="search-form" class="search-card">
                <div class="form-group">
                    <label class="form-label" for="location-input">Dia diem trung tam</label>
                    <input class="form-input" type="text" id="location-input" 
                           placeholder="VD: Ho Xuan Huong, nha nghi DaLat Sky..." required>
                </div>
                <div class="form-group">
                    <label class="form-label">Ban kinh khao sat</label>
                    <div class="radius-control">
                        <input type="range" class="radius-slider" id="radius-slider" 
                               min="1" max="50" value="15" step="1">
                        <span class="radius-value" id="radius-value">15 km</span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Thoi gian du bao (tuong lai)</label>
                    <div class="radius-control">
                        <input type="range" class="radius-slider" id="forecast-slider" 
                               min="0" max="72" value="0" step="1">
                        <span class="radius-value" id="forecast-value">Hien tai</span>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">
                    &#128269; Kham pha
                </button>
            </form>
        </section>

        <!-- Results Section (hidden by default) -->
        <section class="results-section" id="results-section" style="display: none;">
            <div class="results-header">
                <div class="results-header-left">
                    <span class="results-count" id="results-count">0 dia diem</span>
                </div>
                <button class="btn-toggle-stats" id="btn-toggle-stats" onclick="toggleTimeline()">
                    &#128202; Thong ke
                </button>
            </div>

            <!-- Timeline Chart Panel (hidden by default) -->
            <div class="timeline-panel" id="timeline-panel" style="display: none;">
                <div class="timeline-panel-header">
                    <h3>&#128200; Bieu do chi so san may theo thoi gian</h3>
                </div>
                <div class="timeline-canvas-wrapper">
                    <canvas id="timeline-chart"></canvas>
                </div>
                <div class="timeline-legend" id="timeline-legend"></div>
            </div>

            <div class="results-grid">
                <div id="results-container" class="results-list"></div>
                <div id="map-container" class="map-container">
                    <div id="cloud-map" class="cloud-map"></div>
                </div>
            </div>
        </section>
    </div>

    <!-- Modal: Gợi ý địa điểm -->
    <div id="places-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">&#9728; Tiện ích quanh đây</h3>
                <span class="modal-close" id="modal-close">&times;</span>
            </div>
            <div class="modal-body">
                <div id="modal-loading" style="display: none; text-align: center; padding: 20px;">
                    Đang tìm các quán ăn, cafe, homestay quanh đây...
                </div>
                <div id="modal-places-list" class="places-list">
                    <!-- Danh sách đổ vào đây -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/app/js/api.js"></script>
    <script src="/app/js/app.js"></script>
    <script>initMainPage();</script>
</body>
</html>
